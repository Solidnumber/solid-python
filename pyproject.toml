[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solidnumber"
version = "0.0.1"
description = "Official Python SDK for Solid# — AI business infrastructure (CRM, payments, voice AI, agents)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
authors = [
    { name = "Adam Campbell", email = "adam@solidnumber.com" },
]
keywords = [
    "solidnumber",
    "solid",
    "ai",
    "crm",
    "business",
    "automation",
    "voice-ai",
    "agents",
    "mcp",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://solidnumber.com/docs/sdks"
Documentation = "https://solidnumber.com/docs/api"
Repository = "https://github.com/Solidnumber/solid-python"
Issues = "https://github.com/Solidnumber/solid-python/issues"
"npm CLI" = "https://www.npmjs.com/package/@solidnumber/cli"

[tool.hatch.build.targets.wheel]
packages = ["src/solidnumber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
