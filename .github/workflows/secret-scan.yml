# ─────────────────────────────────────────────────────────────────────────────
# Key scan on every push and pull request. Added 2026-10-10.
#
# WHY: a key in a commit is a leaked key the moment it is pushed.
# scripts/commit-onto-origin.sh in the platform repo scans before a commit
# exists; this catches a push that did not go through that script.
#
# It scans only the commits in the push, so it runs in seconds. A fake key a
# test needs on purpose is marked on its own line with `gitleaks:allow`.
# ─────────────────────────────────────────────────────────────────────────────
name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan the pushed commits for keys
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="-1 $AFTER"          # a new branch or a force push: the newest commit
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "scanning: $RANGE"
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --no-banner --redact --verbose --log-opts="$RANGE" /repo
